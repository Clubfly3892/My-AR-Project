<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR.js Fixed Test</title>
    
    <!-- 互換性が最も高い A-Frame 1.3.0 を採用 -->
    <script src="https://aframe.io"></script>
    
    <!-- A-Frameに対応した公式のAR.js（最新ビルド）を読み込み -->
    <script src="https://githack.com"></script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- trackingMethodを定義し、カメラ映像のブレを防ぐ設定 -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
      vr-mode-ui="enabled: false">
      
      <!-- 
        カメラの初期位置は「0 1.6 0」（人間の目線の高さ）です。
        オブジェクトを「0 1.6 -3」に配置することで、首を動かさず真っ直ぐ前（奥に3m）を見た位置に出現させます。
      -->
      <a-box 
        position="0 1.6 -3" 
        material="color: #FF0000; shader: flat;" 
        scale="0.5 0.5 0.5">
      </a-box>
      
      <!-- カメラ自体の位置を初期化 -->
      
      
    </a-scene>

  </body>
</html>
