<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Sync Fix</title>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
      #ar-canvas { width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>

    <!-- 描画用のキャンバス -->
    <canvas id="ar-canvas"></canvas>

    <script>
      const canvas = document.getElementById('ar-canvas');
      const ctx = canvas.getContext('2d');
      
      // 内部処理用のビデオタグ
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;

      let rotation = 0;
      let isCameraReady = false; // カメラの準備ができたか管理するフラグ

      // 1. カメラを起動
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
        audio: false 
      })
      .then(function(stream) {
        video.srcObject = stream;
        
        // 【重要】ブラウザが動画の再生（受信）を実際に開始した瞬間をキャッチ
        video.addEventListener('playing', () => {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          isCameraReady = true; // ここで初めて準備完了にする
        });
      })
      .catch(function(err) {
        alert("カメラ起動エラー: " + err.message);
      });

      // 2. 毎フレーム実行されるループ関数
      function drawLoop() {
        // 先に次のフレームの予約をしておく（ループを途切れさせない）
        requestAnimationFrame(drawLoop);

        // カメラの準備ができていない（映像が届いていない）間は、画面を一旦クリアして待機
        if (!isCameraReady) {
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return; 
        }

        // ① 背景にカメラ映像を描写
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // ② その上に赤い四角を描写
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rotation);
        
        ctx.fillStyle = "rgba(255, 0, 0, 0.9)";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        
        ctx.fillRect(-50, -50, 100, 100);
        ctx.strokeRect(-50, -50, 100, 100);
        ctx.restore();

        rotation += 0.02;
      }

      // ループ処理を起動（カメラの状態に関わらず監視をスタート）
      drawLoop();
    </script>
  </body>
</html>
