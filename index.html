<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chromebook AR Canvas Fix</title>
    
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>

    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
      
      /* カメラ映像を最背面に配置 */
      #webcam-fallback { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; z-index: 1; 
      }
      
      /* 3D空間のキャンバスを手前に配置（カメラ映像より大きい数値） */
      a-scene { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        z-index: 10; pointer-events: none;
      }
    </style>
  </head>
  
  <body>
    <!-- カメラ映像の背景 -->
    <video id="webcam-fallback" autoplay playsinline muted></video>

    <!-- 
      ① 【超重要】「visible: false」を背景コンポーネントに指定。
      これでA-Frame特有の真っ黒な不透明背景が消え、下のカメラ映像が透けて見えます。
    -->
    <a-scene embedded vr-mode-ui="enabled: false" background="visible: false">
      
      <!-- カメラの正面（手前1.5メートル）の位置に赤い箱を固定 -->
      
        <a-box 
          position="0 0 -1.5" 
          material="color: #FF0000; shader: flat;" 
          scale="0.3 0.3 0.3">
        </a-box>
      
      
    </a-scene>

    <script>
      // Chromebookの内蔵カメラを起動して背景に流し込む処理
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
        audio: false 
      })
      .then(function(stream) {
        document.getElementById('webcam-fallback').srcObject = stream;
      })
      .catch(function(err) {
        alert("カメラ起動エラー: " + err.message);
      });
    </script>
  </body>
</html>
