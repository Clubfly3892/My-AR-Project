<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chromebook Camera Test</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- arjsのパラメータを変更し、マーカーなしで動くように設定 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- カメラの目の前（Z軸に-3、つまり奥に3メートル）の位置に球体を配置 -->
      <a-sphere position="0 0 -3" radius="0.5" color="blue"></a-sphere>
      
      
    </a-scene>
  </body>
</html>
